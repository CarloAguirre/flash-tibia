name: tibia-canary15

services:
  canary-db:
    image: mariadb:11
    container_name: canary-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: otservbr-global
      MARIADB_USER: canary
      MARIADB_PASSWORD: canary
    volumes:
      - canary-db-data:/var/lib/mysql
      - ./canary-main/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./canary-main/docker/data/01-test_account.sql:/docker-entrypoint-initdb.d/02-test_account.sql:ro
      - ./canary-main/docker/data/02-test_account_players.sql:/docker-entrypoint-initdb.d/03-test_account_players.sql:ro
    ports:
      - "${CANARY_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  canary:
    image: canary:15.00-local
    build:
      context: ./canary-main
      dockerfile: docker/Dockerfile.local
      target: prod
    container_name: canary-server
    restart: unless-stopped
    env_file:
      - ./canary-main/docker/.env
    depends_on:
      canary-db:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
    volumes:
      - ./canary-main:/srv/canary
    expose:
      - "7271"
      - "7272"

  canary-login:
    image: opentibiabr/login-server:latest
    container_name: canary-login
    restart: unless-stopped
    environment:
      LOGIN_HTTP_PORT: "8090"
      LOGIN_GRPC_PORT: "9091"
      MYSQL_HOST: canary-db
      MYSQL_PORT: "3306"
      MYSQL_DBNAME: otservbr-global
      MYSQL_USER: canary
      MYSQL_PASS: canary
      SERVER_NAME: Eldera Online 15
      SERVER_IP: "${CANARY_PUBLIC_HOST:-localhost}"
      SERVER_PORT: "7272"
      SERVER_LOCATION: BRA
      RATE_LIMITER_RATE: "2"
      RATE_LIMITER_BURST: "5"
    depends_on:
      canary-db:
        condition: service_healthy
    expose:
      - "8090"
    ports:
      - "${CANARY_LOGIN_PORT:-8090}:8090"

  canary-proxy:
    image: tibia-proxy
    build: ./proxy
    container_name: canary-proxy
    restart: unless-stopped
    depends_on:
      - canary
    environment:
      TFS_HOST: canary
      TFS_LOGIN: "7271"
      TFS_GAME: "7272"
      HEALTH_PORT: "7980"
    ports:
      - "${CANARY_STATUS_PORT:-7271}:7271"
      - "${CANARY_GAME_PORT:-7272}:7272"
      - "${CANARY_PROXY_HEALTH_PORT:-7980}:7980"

  ai-gateway:
    image: eldera-ai-gateway
    build: ./ai-gateway
    container_name: eldera-ai-gateway
    restart: unless-stopped
    environment:
      PORT: "8095"
      AI_GATEWAY_MODE: "mock"
      GEMINI_ENABLED: "false"
      MAX_BODY_BYTES: "32768"
      MAX_TEXT_BYTES: "240"
    expose:
      - "8095"
    ports:
      - "${AI_GATEWAY_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  web15:
    image: tibia-web
    build: ./web
    container_name: tibia-web15
    restart: unless-stopped
    depends_on:
      - canary-login
      - canary-proxy
    environment:
      PORT: "8081"
      WEB_ROOT: /app/public
      LOGIN_PROXY_PREFIX: /canary-login
      LOGIN_PROXY_HOST: canary-login
      LOGIN_PROXY_PORT: "8090"
    volumes:
      - ./web15/public:/app/public:ro
    ports:
      - "${CANARY_WEB_PORT:-8081}:8081"

  myaac15:
    image: myaac15
    build: ./myaac-15.xx
    container_name: myaac15
    restart: unless-stopped
    depends_on:
      canary-db:
        condition: service_healthy
      canary:
        condition: service_started
      canary-login:
        condition: service_started
    volumes:
      - ./myaac-15.xx:/var/www/html
      - ./web15/public:/var/www/html/game:ro
      - ./canary-main:/srv/canary:ro
    ports:
      - "${MYAAC15_PORT:-8082}:80"

volumes:
  canary-db-data: