<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Canary 15</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505 url("background.png?v=canary15-ui14-no-copilot") center center / cover no-repeat;
        overscroll-behavior: contain;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      .backbuffer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        display: block;
        overflow: hidden;
        opacity: 0;
        image-rendering: auto;
        -ms-interpolation-mode: bicubic;
        transition: opacity 260ms ease;
      }

      body.game-visible .backbuffer {
        opacity: 1;
      }

      .title {
        pointer-events: none;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        width: 1px;
        height: 1px;
        overflow: hidden;
        color: transparent;
        caret-color: transparent;
        background: transparent;
        opacity: 0;
        outline: none;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        user-select: none;
      }

      #start {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 4;
        display: none;
        transform: translate(-50%, -50%);
        font-size: 2rem;
      }

      #fullscreen {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 12;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      #fullscreen:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      #preload-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.62)), url("background.png?v=canary15-ui14-no-copilot");
        background-position: center;
        background-size: cover;
        color: #f4efe4;
        transition: opacity 300ms ease, visibility 300ms ease;
      }

      #preload-screen.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-box {
        width: min(420px, calc(100vw - 40px));
        padding: 22px 24px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(8, 10, 12, 0.68);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
        text-align: center;
        backdrop-filter: blur(3px);
      }

      .loader-title {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .loader-detail {
        min-height: 20px;
        margin: 0 0 16px;
        color: rgba(244, 239, 228, 0.82);
        font-size: 14px;
      }

      .loader-track {
        width: 100%;
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      .loader-bar {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #d7b66f, #f0df9f);
        transition: width 180ms ease;
      }
    </style>
  </head>
  <body>
    <div class="title" id="title-text" contenteditable virtualkeyboardpolicy="manual"></div>
    <button id="start" onclick="startGame()">Start</button>
    <button id="fullscreen" onclick="toggleFullscreen()" title="Pantalla completa" aria-label="Pantalla completa">&#9974;</button>
    <canvas class="backbuffer" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>

    <div id="preload-screen" aria-live="polite">
      <div class="loader-box">
        <p class="loader-title" id="loader-status">Cargando cliente</p>
        <p class="loader-detail" id="loader-detail">Preparando archivos del juego</p>
        <div class="loader-track" aria-hidden="true">
          <div class="loader-bar" id="loader-bar"></div>
        </div>
      </div>
    </div>

    <script>
      var canvas = document.getElementById("canvas");
      var embeddedMode = new URLSearchParams(window.location.search).get("embedded") === "1" || window.self !== window.top;
      var gameStarted = false;
      var preloadHidden = false;
      var firstFrameFallbackTimer = null;
      var preloadScreen = document.getElementById("preload-screen");
      var loaderStatus = document.getElementById("loader-status");
      var loaderDetail = document.getElementById("loader-detail");
      var loaderBar = document.getElementById("loader-bar");
      var loaderProgress = 4;
      var reloadGuardEnabled = false;

      window.addEventListener("beforeunload", function (event) {
        if (!reloadGuardEnabled || !gameStarted) return;
        event.preventDefault();
        event.returnValue = "";
        return "";
      });

      function setLoaderProgress(value) {
        loaderProgress = Math.max(loaderProgress, Math.min(100, value));
        loaderBar.style.width = loaderProgress + "%";
      }

      function setLoaderText(status, detail) {
        loaderStatus.textContent = status;
        loaderDetail.textContent = detail || "";
      }

      function hidePreloadScreen() {
        if (preloadHidden) return;
        preloadHidden = true;
        if (firstFrameFallbackTimer) {
          clearTimeout(firstFrameFallbackTimer);
          firstFrameFallbackTimer = null;
        }
        setLoaderProgress(100);
        document.body.classList.add("game-visible");
        reloadGuardEnabled = true;
        preloadScreen.classList.add("is-hidden");
        setTimeout(function () {
          try {
            canvas.focus({ preventScroll: true });
          } catch (error) {
            try { canvas.focus(); } catch (innerError) {}
          }
        }, 160);
      }

      function isHiddenTextInputEvent(event) {
        return event && event.target && event.target.id === "title-text";
      }

      function setupHiddenTextInput() {
        var titleText = document.getElementById("title-text");
        if (!titleText || titleText.__otclientInputBridgeReady) return;
        titleText.__otclientInputBridgeReady = true;
        titleText.addEventListener("input", function () {
          titleText.textContent = "";
          titleText.innerHTML = "";
        });
      }

      setupHiddenTextInput();

      function handleFirstFrame() {
        hidePreloadScreen();
      }

      window.__otclientNotifyFirstFrame = handleFirstFrame;
      window.addEventListener("otclient-first-frame", handleFirstFrame);

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }

      function updateFullscreenButton() {
        var button = document.getElementById("fullscreen");
        if (!button) return;
        var active = !!fullscreenElement();
        button.title = active ? "Salir de pantalla completa" : "Pantalla completa";
        button.setAttribute("aria-label", button.title);
      }

      function toggleFullscreen() {
        var root = document.documentElement;
        if (fullscreenElement()) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
          return;
        }
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        if (request) {
          var result = request.call(root);
          if (result && result.catch) {
            result.catch(function (error) { console.warn("fullscreen request failed", error); });
          }
        }
      }

      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

      (function () {
        var OriginalWebSocket = window.WebSocket;
        function rewriteWebSocketUrl(url) {
          try {
            var parsed = new URL(url);
            var port = parsed.port || (parsed.protocol === "wss:" ? "443" : parsed.protocol === "ws:" ? "80" : "");
            if (port === "443") {
              parsed.protocol = "ws:";
              parsed.port = "7272";
            } else if (port === "80") {
              parsed.protocol = "ws:";
              parsed.port = "7271";
            } else if (parsed.protocol === "wss:" && (parsed.hostname === "localhost" || parsed.hostname === "127.0.0.1")) {
              parsed.protocol = "ws:";
            }
            return parsed.toString();
          } catch (error) {
            return url;
          }
        }
        window.WebSocket = function (url, protocols) {
          return new OriginalWebSocket(rewriteWebSocketUrl(url), protocols);
        };
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
        window.WebSocket.OPEN = OriginalWebSocket.OPEN;
        window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
        window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
      })();

      function reportRuntimeError(prefix, error) {
        var payload = [prefix, error].flat().filter(Boolean).map(function (entry) {
          if (!entry) return "";
          if (typeof entry === "string") return entry;
          if (entry.stack) return entry.stack;
          try { return JSON.stringify(entry); } catch (_) { return String(entry); }
        }).join(": ");
        console.error(payload);
        setLoaderText("Error al iniciar", "Revisa la consola del navegador");
      }

      function startGame() {
        if (gameStarted) return;
        gameStarted = true;
        document.getElementById("start").style.display = "none";
        setLoaderProgress(100);
        setLoaderText("Inicializando cliente", "Esperando el primer render");
        if (firstFrameFallbackTimer) clearTimeout(firstFrameFallbackTimer);
        firstFrameFallbackTimer = setTimeout(hidePreloadScreen, 15000);
        callMain();
        document.addEventListener("touchstart", function (event) { event.preventDefault(); event.stopPropagation(); });
        document.addEventListener("touchmove", function (event) { event.preventDefault(); event.stopPropagation(); });
        document.addEventListener("touchend", function (event) { event.preventDefault(); event.stopPropagation(); });
        document.addEventListener("keyup", function (event) {
          if (isHiddenTextInputEvent(event)) return true;
          event.preventDefault();
          event.stopPropagation();
        });
        document.addEventListener("keydown", function (event) {
          if (isHiddenTextInputEvent(event)) return true;
          if (
            !event.ctrlKey &&
            event.key !== "Enter" &&
            event.key !== "Escape" &&
            event.key !== "Backspace" &&
            event.key !== "ArrowLeft" &&
            event.key !== "ArrowRight" &&
            event.key !== "ArrowUp" &&
            event.key !== "ArrowDown"
          ) {
            canvas.dispatchEvent(new KeyboardEvent("keypress", event));
          } else if (event.ctrlKey && event.key === "v") {
            return true;
          }
          event.preventDefault();
          event.stopPropagation();
        });
      }

      var Module = {
        locateFile: function (path) {
          var baseURL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/"));
          var url = baseURL + "/" + path;
          return path === "otclient.data" || path === "otclient.wasm" ? url + "?v=canary15-ui14-no-copilot" : url;
        },
        preRun: [function () {
          addRunDependency("syncfs");
          var syncDone = false;
          function finishSync(error) {
            if (syncDone) return;
            syncDone = true;
            if (error) Module.print(error);
            removeRunDependency("syncfs");
          }
          setTimeout(function () { finishSync("IDBFS sync timeout"); }, 3000);
          if (!FS.analyzePath("/user").exists) FS.mkdir("/user");
          FS.mount(IDBFS, { autoPersist: true }, "/user");
          FS.syncfs(true, function (error) { finishSync(error); });
        }],
        postRun: [function () {
          setTimeout(startGame, 0);
        }],
        print: function () { console.log(Array.prototype.slice.call(arguments).join(" ")); },
        printErr: function () { reportRuntimeError("stderr", Array.prototype.slice.call(arguments).join(" ")); },
        canvas: canvas,
        onAbort: function (reason) { reportRuntimeError("abort", reason || "unknown reason"); },
        setStatus: function (statusText) {
          console.log("status: " + statusText);
          var display = "";
          var match = statusText.match(/Downloading data\.\.\. \((\d+)\/(\d+)\)/);
          if (match) {
            var loaded = Number(match[1]);
            var total = Number(match[2]);
            if (total > 0) {
              setLoaderProgress(8 + Math.round((loaded / total) * 82));
              setLoaderText("Descargando cliente", Math.round((loaded / total) * 100) + "%");
            }
          } else if (statusText.includes("Running...")) {
            setLoaderProgress(100);
            setLoaderText("Datos cargados", "Inicializando cliente");
          }
          document.getElementById("title-text").innerHTML = display;
        },
        monitorRunDependencies: function (left) {
          console.log("monitor run deps: " + left);
          setLoaderText("Inicializando cliente", "Montando datos locales");
          setLoaderProgress(90);
        }
      };

      window.onerror = function (message, source, lineno, colno, error) {
        reportRuntimeError("window.onerror", error || message);
      };
      window.addEventListener("unhandledrejection", function (event) {
        reportRuntimeError("unhandledrejection", event.reason || "Promise rejected");
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
